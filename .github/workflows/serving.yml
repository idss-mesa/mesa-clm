name: Serving

# CPU-only checks for the serve-venv side (serving/, deploy/), which never imports mesa_clm.
# Skeleton until milestone M1 lands the patches, scripts and units it will check (plan §9).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "serving/**"
      - "deploy/**"
      - ".github/workflows/serving.yml"

permissions:
  contents: read

concurrency:
  group: serving-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serving:
    name: serving checks (CPU only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: TODO(M1) serving checks
