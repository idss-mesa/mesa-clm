# mypy for the serve-venv side (serving/*.py), which never imports mesa_clm (plan §3).
# Used as `mypy --config-file serving/mypy.ini serving` by .github/workflows/serving.yml, with
# numpy, fastapi, uvicorn and httpx installed; torch, transformers, vllm (vllm_routes.py runs in the
# encoder container) and the CLM clone (clm) are not, so their imports are Any.
[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_unreachable = True

[mypy-torch.*,transformers.*,clm.*,cuda_encoder,vllm.*]
ignore_missing_imports = True
